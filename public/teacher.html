<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Bank Office · Student Business Game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23c99a2e'/><text x='50' y='68' font-size='56' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%23123f2f'>$</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="loginScreen" class="auth-wrap hidden">
  <div class="auth">
    <div class="brand"><span class="seal">$</span>Teacher Bank Office</div>
    <form class="card" id="tLogin">
      <label>Teacher password</label>
      <input name="password" type="password" required autocomplete="current-password">
      <button class="btn primary block lg" type="submit" style="margin-top:16px">Log in</button>
    </form>
    <p class="small muted" style="text-align:center;margin-top:16px"><a href="/">Student login</a></p>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="inner">
      <span class="brand"><span class="seal">$</span><span>Bank Office</span></span>
      <nav class="tabs" id="nav">
        <button data-tab="home" class="active">Overview</button>
        <button data-tab="permits">Permits</button>
        <button data-tab="grants">Grants</button>
        <button data-tab="loans">Loans</button>
        <button data-tab="money">Award / Charge</button>
        <button data-tab="students">Students</button>
        <button data-tab="ledger">Transactions</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <span class="spacer"></span>
      <button class="btn sm ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="logout">Log out</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<script src="/js/common.js"></script>
<script src="/js/teacher.js"></script>
</body>
</html>
